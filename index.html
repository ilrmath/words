<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>用語サーチ｜意味・出現率・厳選キーワード300</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #697386;
      --line: #dfe5ee;
      --paper: #ffffff;
      --canvas: #f4f7fb;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --high: #0f9f6e;
      --high-soft: #e8f7f1;
      --mid: #d97706;
      --mid-soft: #fff5df;
      --low: #dc3c4b;
      --low-soft: #fff0f1;
      --none: #758195;
      --shadow: 0 14px 40px rgba(23, 32, 51, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 0%, rgba(37,99,235,.10), transparent 30rem),
        var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 58px 0 22px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--accent); font-size: .82rem; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 22px; height: 3px; border-radius: 99px; background: var(--accent); }
    h1 { margin: 9px 0 8px; font-size: clamp(2rem, 5vw, 3.35rem); line-height: 1.13; letter-spacing: -.03em; }
    .lead { margin: 0; max-width: 760px; color: var(--muted); }
    .search-panel {
      position: sticky; top: 12px; z-index: 10;
      margin: 22px 0 22px; padding: 16px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
      border: 1px solid rgba(223,229,238,.9); border-radius: 22px; box-shadow: var(--shadow);
    }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #query {
      width: 100%; height: 54px; padding: 0 48px;
      border: 2px solid transparent; border-radius: 15px;
      background: #f3f6fb; color: var(--ink); outline: none;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    #query:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
    #clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border: 0; border-radius: 50%;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    #clear:hover { background: #e7ebf2; color: var(--ink); }
    #search-button {
      min-width: 116px; border: 0; border-radius: 15px; padding: 0 22px;
      background: var(--accent); color: #fff; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 18px rgba(37,99,235,.24);
    }
    #search-button:hover { filter: brightness(.95); }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; color: var(--muted); font-size: .88rem; }
    .example {
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
      background: #fff; color: #3e4b61; cursor: pointer;
    }
    .example:hover { border-color: #9db9f7; color: var(--accent); background: var(--accent-soft); }
    .summary { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 28px 2px 12px; }
    #status { font-weight: 800; }
    .rule-note { color: var(--muted); font-size: .82rem; text-align: right; }
    .results { display: grid; gap: 15px; padding-bottom: 52px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
      padding: clamp(18px, 3vw, 27px); box-shadow: 0 7px 22px rgba(23,32,51,.055);
    }
    .card-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .term { margin: 0; font-size: clamp(1.25rem, 3vw, 1.68rem); line-height: 1.35; }
    .aliases { color: var(--muted); font-size: .86rem; margin-top: 3px; }
    .badge { flex: 0 0 auto; padding: 5px 12px; border-radius: 999px; font-size: .84rem; font-weight: 900; }
    .badge.high { color: var(--high); background: var(--high-soft); }
    .badge.mid { color: var(--mid); background: var(--mid-soft); }
    .badge.low { color: var(--low); background: var(--low-soft); }
    .badge.none { color: var(--none); background: #edf0f5; }
    .description { margin: 17px 0 19px; font-size: 1.02rem; white-space: pre-wrap; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .chip { border-radius: 999px; padding: 4px 10px; background: #f1f4f8; color: #4a566b; font-size: .78rem; }
    .rate-layout { display: grid; grid-template-columns: 210px 1fr; gap: 22px; align-items: center; }
    .primary-rate { border-radius: 16px; padding: 14px 16px; background: #f7f9fc; }
    .primary-label { color: var(--muted); font-size: .78rem; }
    .primary-number { font-size: 2.15rem; line-height: 1.15; font-weight: 900; letter-spacing: -.04em; }
    .primary-version { color: var(--muted); font-size: .76rem; }
    .rate-list { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; }
    .rate-item { min-width: 0; }
    .rate-top { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font-size: .75rem; }
    .track { height: 7px; margin-top: 5px; overflow: hidden; border-radius: 99px; background: #e9edf3; }
    .fill { height: 100%; min-width: 0; border-radius: inherit; background: var(--accent); }
    .empty { color: #a1a9b7; }
    .empty-state { text-align: center; padding: 54px 24px; color: var(--muted); }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 1.15rem; }
    footer { padding: 18px 0 42px; color: var(--muted); font-size: .76rem; text-align: center; }
    mark { background: #fff1a8; color: inherit; padding: 0 .06em; border-radius: 3px; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 1040px); }
      header { padding-top: 35px; }
      .search-panel { top: 6px; border-radius: 17px; padding: 10px; }
      .search-row { grid-template-columns: 1fr; }
      #search-button { min-height: 48px; }
      .summary { display: block; }
      .rule-note { margin-top: 3px; text-align: left; }
      .rate-layout { grid-template-columns: 1fr; gap: 13px; }
      .rate-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .card-head { align-items: center; }
    }
    #query::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
    :root { --star: #b7791f; --star-soft: #fff7e0; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 12px; }
    .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: #eef2f8; }
    .seg button { border: 0; background: transparent; color: #4a566b; padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: .86rem; font-weight: 700; }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(23,32,51,.10); }
    .filters select { height: 34px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); padding: 0 8px; font: inherit; font-size: .86rem; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: #3e4b61; cursor: pointer; user-select: none; }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
    .tool-btn { border: 1px solid var(--line); background: #fff; color: #3e4b61; border-radius: 10px; padding: 5px 11px; font-size: .86rem; font-weight: 700; cursor: pointer; }
    .tool-btn:hover, .tool-btn.on { border-color: #9db9f7; color: var(--accent); background: var(--accent-soft); }
    .spacer { flex: 1 1 auto; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .badge.star { color: var(--star); background: var(--star-soft); letter-spacing: .04em; }
    .badge.star .dim { opacity: .28; }
    .book-tag { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; padding: 3px 10px; border-radius: 8px; background: var(--star-soft); color: #7a5512; font-size: .78rem; font-weight: 700; }
    .answer { position: relative; margin: 15px 0 17px; border-radius: 14px; }
    .note { margin: 0 0 10px; }
    .note:last-child { margin-bottom: 0; }
    .note-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: .74rem; font-weight: 800; letter-spacing: .04em; }
    .note p { margin: 0; font-size: 1.02rem; white-space: pre-wrap; }
    .note.book { padding: 11px 14px; border-left: 4px solid #f0c25b; background: #fffbef; border-radius: 0 12px 12px 0; }
    .note.list p { color: #2b3548; }
    .concealed .answer { cursor: pointer; }
    .concealed .answer > * { filter: blur(7px); opacity: .55; user-select: none; transition: filter .2s, opacity .2s; }
    .concealed .answer::after { content: "タップして答えを表示"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); font-weight: 800; font-size: .92rem; }
    .concealed.revealed .answer > * { filter: none; opacity: 1; user-select: auto; }
    .concealed.revealed .answer::after { display: none; }
    .card-foot { display: flex; justify-content: flex-end; margin-top: 16px; }
    .learn-btn { border: 1px solid var(--line); background: #fff; color: #4a566b; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: .84rem; font-weight: 800; }
    .learn-btn[aria-pressed="true"] { border-color: transparent; background: var(--high-soft); color: var(--high); }
    .card.learned { border-color: #bfe6d6; }
    .no-rate { color: var(--muted); font-size: .84rem; padding: 10px 14px; border-radius: 12px; background: #f7f9fc; }
    .more { display: block; margin: 4px auto 0; }
    /* dashboard */
    .dash h2 { margin: 0 0 4px; font-size: 1.3rem; }
    .dash .sub { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
    .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .progress .track { flex: 1; height: 10px; margin: 0; }
    .progress .fill { background: var(--high); }
    .progress strong { white-space: nowrap; font-size: .92rem; }
    .quick { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
    .quick button { text-align: left; border: 1px solid var(--line); background: #fbfcfe; border-radius: 14px; padding: 12px 14px; cursor: pointer; color: var(--ink); }
    .quick button:hover { border-color: #9db9f7; background: var(--accent-soft); }
    .quick b { display: block; font-size: .95rem; }
    .quick span { display: block; color: var(--muted); font-size: .78rem; line-height: 1.45; margin-top: 2px; }
    .chapters { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 9px; }
    .chapters button { border: 1px solid var(--line); background: #fff; border-radius: 13px; padding: 10px 12px; text-align: left; cursor: pointer; color: var(--ink); }
    .chapters button:hover { border-color: #9db9f7; }
    .chapters b { display: block; font-size: .92rem; }
    .chapters small { display: block; color: var(--muted); font-size: .74rem; }
    .chapters .track { height: 5px; margin-top: 7px; }
    .chapters .fill { background: var(--high); }
    .star-split { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .star-split .chip { background: var(--star-soft); color: #7a5512; font-weight: 700; }
    .section-label { margin: 0 0 8px; color: var(--muted); font-size: .78rem; font-weight: 800; letter-spacing: .06em; }
    /* quiz */
    .quiz .q-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
    .quiz .q-text { margin: 4px 0 18px; font-size: 1.08rem; white-space: pre-wrap; padding: 14px 16px; background: #fffbef; border-left: 4px solid #f0c25b; border-radius: 0 12px 12px 0; }
    .quiz .q-text .blank { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--star); }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .options button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-weight: 800; font-size: 1rem; color: var(--ink); }
    .options button:hover:not(:disabled) { border-color: #9db9f7; background: var(--accent-soft); }
    .options button.correct { border-color: var(--high); background: var(--high-soft); color: var(--high); }
    .options button.wrong { border-color: var(--low); background: var(--low-soft); color: var(--low); }
    .options button:disabled { cursor: default; }
    .q-result { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: #f7f9fc; }
    .q-result .verdict { font-weight: 900; margin-bottom: 4px; }
    .q-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .primary-btn { border: 0; border-radius: 12px; padding: 9px 18px; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; }
    footer p { margin: 4px 0; }
    @media (max-width: 720px) {
      .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
      .filters > * { flex: 0 0 auto; }
      .spacer { display: none; }
      .quick { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .chapters { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .options { grid-template-columns: 1fr; }
      .card-head { flex-direction: column; align-items: stretch; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="eyebrow">Term finder × 情報Ⅰ厳選キーワード300</div>
    <h1>用語サーチ</h1>
    <p class="lead">用語を入力すると、意味・カテゴリ・教科書での出現率を検索し、出現率が高いか低いかを判定します。参考書付録「情報Ⅰ厳選キーワード300」の頻出度（★）・解説・書籍ページも一緒に表示し、暗記モードやクイズで復習できます。</p>
  </header>

  <main class="shell">
    <section class="search-panel" aria-label="用語検索">
      <div class="search-row">
        <div class="search-wrap">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="query" type="search" autocomplete="off" placeholder="例：情報、著作権、アルゴリズム（/ キーでフォーカス）" aria-label="検索する用語">
          <button id="clear" type="button" aria-label="入力を消去" title="入力を消去">×</button>
        </div>
        <button id="search-button" type="button">検索</button>
      </div>
      <div class="filters" role="toolbar" aria-label="絞り込み">
        <div class="seg" id="scope" role="group" aria-label="対象">
          <button type="button" data-scope="all" aria-pressed="true">すべての用語</button>
          <button type="button" data-scope="book" aria-pressed="false">厳選300</button>
          <button type="button" data-scope="top" aria-pressed="false">★★★のみ</button>
        </div>
        <select id="chapter" aria-label="章で絞り込み"><option value="">全章</option></select>
        <select id="sort" aria-label="並び順">
          <option value="auto">並び順：自動</option>
          <option value="rel">関連度順</option>
          <option value="no">番号順（付録の順）</option>
          <option value="star">頻出度（★）順</option>
          <option value="rate">出現率順</option>
        </select>
        <label class="toggle"><input type="checkbox" id="hide"> 暗記モード</label>
        <label class="toggle"><input type="checkbox" id="unlearned"> 未習得のみ</label>
        <span class="spacer"></span>
        <button type="button" class="tool-btn" id="today-btn">今日の10語</button>
        <button type="button" class="tool-btn" id="quiz-btn">4択クイズ</button>
      </div>
      <div class="examples"><span>例：</span><button class="example">情報</button><button class="example">データ</button><button class="example">著作権</button><button class="example">アルゴリズム</button><button class="example">AI</button><button class="example">公開鍵</button><button class="example">標本化</button></div>
    </section>

    <section class="summary" aria-live="polite">
      <div id="status">用語を入力してください</div>
      <div class="rule-note">出現率　高い：50%以上 ／ ふつう：25〜49% ／ 低い：25%未満<br>頻出度★★★〜★：参考書付録による共通テスト頻出度</div>
    </section>
    <section id="results" class="results"></section>
  </main>

  <footer class="shell">
    <p>Book1.xlsx を基に作成 ・ 収録用語 <span id="record-count"></span>件 ・ うち厳選キーワード <span id="book-count"></span>語（おまけ含む）</p>
    
  </footer>

証","c":"第8章","p":"223","s":2,"d":"本人の身体的特徴や行動的特徴の情報を使って認証を行う認証方式のこと。「バイオメトリクス認証」ともいう。","ids":[263,1567],"al":["生体認証"]},{"n":287,"k":"所有物認証","c":"第8章","p":"223","s":1,"d":"本人が所有しているものを使って認証を行う認証方式のこと。","ids":[251],"al":["所有物認証"]},{"n":288,"k":"デジタルデバイド","c":"第8章","p":"225","s":2,"d":"情報技術を利用できる人とできない人との間に生じる格差。「情報格差」ともいう。","ids":[322],"al":["デジタルデバイド"]},{"n":289,"k":"VR","c":"第8章","p":"225","s":1,"d":"ヘッドマウントディスプレイなどを使って，仮想的な空間を現実であるかのように擬似体験できる技術。「仮想現実」ともいう。","ids":[356,797],"al":["VR"]},{"n":290,"k":"AR","c":"第8章","p":"225","s":2,"d":"スマートフォンのカメラ映像などに，文字や画像などの情報を重ねて表示させる技術のこと。「拡張現実」ともいう。なお、VRとARを組み合わせた技術のことを「MR（複合現実）」という。","ids":[354,795],"al":["AR"]},{"n":291,"k":"VDT障害","c":"第8章","p":"226","s":1,"d":"ディスプレイを長時間操作していることによって発症する視力や集中力が低下する身体的問題","ids":[327],"al":["VDT障害"]},{"n":292,"k":"ビッグデータ","c":"第8章","p":"228, 229","s":3,"d":"従来のデータベース管理システムでは扱いきれないほど巨大で複雑なデータの集合。「多様性（Variety）」「頻度（Velocity）」「量（Volume）」の3つの特徴を持つ。","ids":[364,1935],"al":["ビッグデータ"]},{"n":293,"k":"情報システム","c":"第9章","p":"229","s":3,"d":"ネットワーク上でのデータのやり取りを通じて，さまざまな機能を提供する仕組み。","ids":[1683],"al":["情報システム"]},{"n":294,"k":"ブロックチェーン","c":"第9章","p":"229","s":1,"d":"分散された複数のコンピュータが互いに連携し，取引情報などのデータを共有・管理する仕組み。","ids":[386,1616],"al":["ブロックチェーン"]},{"n":295,"k":"リレーショナルデータベース","c":"第9章","p":"230","s":3,"d":"表（テーブル）を用いてデータを管理し，複数の表を関係づけるデータベースのこと。「RDB」（Relational DataBase）と略されることが多い。","ids":[1646],"al":["リレーショナルデータベース"]},{"n":296,"k":"選択","c":"第9章","p":"230","s":3,"d":"表の中から特定の条件に合致する行だけ抽出して表示する操作のこと。","ids":[1161,1661],"al":["選択"]},{"n":297,"k":"結合","c":"第9章","p":"230","s":1,"d":"複数の表を，特定の条件に従って結び付け，一つの表として表示する操作のこと。","ids":[1657],"al":["結合"]},{"n":298,"k":"射影","c":"第9章","p":"230","s":2,"d":"表の中から特定の条件に合致する列だけ抽出して表示する操作のこと。","ids":[1658],"al":["射影"]},{"n":299,"k":"主キー","c":"第9章","p":"230","s":1,"d":"レコード（表の行）を一意に特定するのに必要な項目。","ids":[1638],"al":["主キー"]},{"n":300,"k":"外部キー","c":"第9章","p":"230","s":1,"d":"他の表の主キーを参照している項目。","ids":[1656],"al":["外部キー"]},{"n":null,"k":"階級値","c":"おまけ","p":"20","s":0,"d":"各階級の中央の値。階級の上限値と下限値を足して2で割った値。","ids":[1982],"al":["階級値"]},{"n":null,"k":"散布図行列","c":"おまけ","p":"38","s":0,"d":"複数の変数間の関係を一度に確認できるようにしたもの。行と列の形に変数を並べ，交差する各マスにその2つの変数の散布図を表示することで，変数どうしの相関の有無や傾向を比較しやすくしている。","ids":[1914],"al":["散布図行列"]},{"n":null,"k":"時系列データ","c":"おまけ","p":"41","s":0,"d":"時間の経過とともに測定されたデータ。","ids":[1893],"al":["時系列データ"]},{"n":null,"k":"LLM","c":"おまけ","p":"なし","s":0,"d":"大規模言語モデルの略。","ids":[425],"al":["LLM"]}];
    const RATE_LABELS = ["率3.1", "率3.0", "率2", "率1"];
    const CHAPTERS = ["第1章","第2章","第3章","第4章","第5章","第6章","第7章","第8章","第9章","おまけ"];
    const PAGE_SIZE = 50;
    const STORE_KEY = "yougo-search-learned-v1";
    const queryInput = document.getElementById("query");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const chapterEl = document.getElementById("chapter");
    const sortEl = document.getElementById("sort");
    const hideEl = document.getElementById("hide");
    const unlearnedEl = document.getElementById("unlearned");

    const escapeHTML = (value) => String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const hiraToKata = (value) => value.replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
    const normalize = (value) => hiraToKata(String(value ?? "").normalize("NFKC").toLowerCase()).replace(/[\s・･_\-‐‑–—]/g, "");
    const aliasesOf = (term) => term.split("|").map(v => v.trim()).filter(Boolean);
    const rateText = (value) => value == null ? "—" : `${Math.round(value * 100)}%`;
    const starText = (n) => "★".repeat(n);

    function assessment(value) {
      if (value == null) return { label: "出現率データなし", cls: "none" };
      if (value >= .5) return { label: "出現率：高い", cls: "high" };
      if (value >= .25) return { label: "出現率：ふつう", cls: "mid" };
      return { label: "出現率：低い", cls: "low" };
    }

    function currentRate(record) {
      for (let i = 0; i < record.rates.length; i += 1) {
        if (record.rates[i] != null) return { value: record.rates[i], label: RATE_LABELS[i] };
      }
      return { value: null, label: "利用可能な率なし" };
    }

    /* ---------- 学習状況（ブラウザに保存） ---------- */
    let learned = new Set();
    try { learned = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch { learned = new Set(); }
    function saveLearned() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...learned])); } catch {} }

    /* ---------- 厳選300と用語リストの結び付け ---------- */
    const recById = new Map(RECORDS.map(r => [r.id, r]));
    const ALL = RECORDS.slice();
    const booksByRec = new Map();
    BOOK.forEach((b, i) => {
      b.idx = i;
      b.key = "B" + normalize(b.k);
      b.order = b.n ?? 300 + i;
      let ids = b.ids.filter(id => recById.has(id));
      if (!ids.length) {
        const syn = { id: 100000 + i, term: b.al.join("|"), attribute: "", code: "", category: "", description: "", rates: [null, null, null, null], synthetic: true };
        recById.set(syn.id, syn); ALL.push(syn); ids = [syn.id];
      }
      b.recs = ids.map(id => recById.get(id));
      b.rec = b.recs.slice().sort((x, y) => (currentRate(y).value ?? -1) - (currentRate(x).value ?? -1))[0];
      ids.forEach(id => { if (!booksByRec.has(id)) booksByRec.set(id, []); booksByRec.get(id).push(b); });
    });
    const keyOf = (item) => item.books.length ? item.books[0].key : "R" + item.rec.id;
    const maxStars = (books) => books.reduce((m, b) => Math.max(m, b.s), -1);
    const minOrder = (books) => books.reduce((m, b) => Math.min(m, b.order), Infinity);
    const uniqueBookKeys = (list) => [...new Set(list.map(b => b.key))];

    document.getElementById("record-count").textContent = ALL.length.toLocaleString("ja-JP");
    document.getElementById("book-count").textContent = BOOK.length.toLocaleString("ja-JP");
    CHAPTERS.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; chapterEl.appendChild(o); });

    /* ---------- 状態 ---------- */
    const state = { scope: "all", chapter: "", sort: "auto", hide: false, unlearned: false, page: 1, mode: "search", today: null };

    function rankItem(item, q) {
      const aliases = aliasesOf(item.rec.term).concat(...item.books.map(b => b.al.concat(b.k))).map(normalize);
      if (aliases.some(v => v === q)) return 0;
      if (aliases.some(v => v.startsWith(q))) return 1;
      if (aliases.some(v => v.includes(q))) return 2;
      if (normalize(item.rec.category).includes(q)) return 3;
      if (normalize(item.rec.description).includes(q)) return 4;
      if (item.books.some(b => normalize(b.d).includes(q))) return 4;
      return 99;
    }

    function highlight(value, rawQuery) {
      const text = String(value ?? "");
      if (!rawQuery.trim()) return escapeHTML(text);
      const safe = escapeHTML(rawQuery.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      try {
        return escapeHTML(text).replace(new RegExp(`(${safe})`, "gi"), "<mark>$1</mark>");
      } catch { return escapeHTML(text); }
    }

    function starBadge(n) {
      if (n < 1) return `<span class="badge star">厳選・おまけ</span>`;
      return `<span class="badge star" title="頻出度">頻出 ${starText(n)}<span class="dim">${starText(3 - n)}</span></span>`;
    }

    function renderCard(item, rawQuery) {
      const { rec, books } = item;
      const aliases = aliasesOf(rec.term);
      const primary = books.length && state.scope !== "all" ? books[0].k : (aliases[0] || rec.term);
      const alternatives = aliases.filter(v => v !== primary);
      const current = currentRate(rec);
      const judged = assessment(current.value);
      const key = keyOf(item);
      const isLearned = learned.has(key);
      const stars = maxStars(books);
      const rateItems = rec.rates.map((rate, index) => `
        <div class="rate-item">
          <div class="rate-top"><span>${RATE_LABELS[index]}</span><strong class="${rate == null ? "empty" : ""}">${rateText(rate)}</strong></div>
          <div class="track"><div class="fill" style="width:${rate == null ? 0 : Math.max(0, Math.min(100, rate * 100))}%"></div></div>
        </div>`).join("");
      const categories = [...new Set((books.length && state.scope !== "all" ? books[0].recs : [rec]).map(r => r.category).filter(Boolean))];
      const chips = [...categories, rec.code ? `コード ${rec.code}` : "", rec.attribute ? `属性 ${rec.attribute}` : ""].filter(Boolean);
      const bookTags = books.map(b => `<span>厳選 ${b.n ? "No." + String(b.n).padStart(3, "0") : "おまけ"}</span><span>${escapeHTML(b.c)}</span><span>書籍 p.${escapeHTML(b.p || "—")}</span>`);
      const bookNotes = books.map(b => `
            <div class="note book"><span class="note-label">参考書の解説${books.length > 1 ? `（${b.n ? "No." + String(b.n).padStart(3, "0") : "おまけ"}）` : ""}</span><p>${highlight(b.d, rawQuery)}</p></div>`).join("");
      const listNote = rec.description || !books.length
        ? `<div class="note list">${books.length ? `<span class="note-label">用語リストの説明</span>` : ""}<p>${highlight(rec.description || "説明データなし", rawQuery)}</p></div>` : "";
      return `
        <article class="card${state.hide ? " concealed" : ""}${isLearned ? " learned" : ""}" data-key="${escapeHTML(key)}">
          <div class="card-head">
            <div>
              <h2 class="term">${highlight(primary, rawQuery)}</h2>
              ${alternatives.length ? `<div class="aliases">別表記：${alternatives.map(v => highlight(v, rawQuery)).join(" ／ ")}</div>` : ""}
              ${bookTags.map(t => `<div class="book-tag">${t}</div>`).join(" ")}
            </div>
            <div class="badges">${books.length ? starBadge(stars) : ""}<span class="badge ${judged.cls}">${judged.label}</span></div>
          </div>
          <div class="answer" data-reveal>${bookNotes}${listNote}</div>
          ${chips.length ? `<div class="meta">${chips.map(v => `<span class="chip">${escapeHTML(v)}</span>`).join("")}</div>` : ""}
          ${rec.synthetic ? `<div class="no-rate">この語は用語リスト（Book1.xlsx）に同じ表記の収録がないため、出現率はありません。</div>` : `
          <div class="rate-layout">
            <div class="primary-rate">
              <div class="primary-label">利用可能な最新出現率</div>
              <div class="primary-number">${rateText(current.value)}</div>
              <div class="primary-version">${escapeHTML(current.label)}${current.label !== "率3.1" && current.value != null ? "（旧版データ）" : ""}</div>
            </div>
            <div class="rate-list" aria-label="版別出現率">${rateItems}</div>
          </div>`}
          <div class="card-foot"><button type="button" class="learn-btn" data-learn="${escapeHTML(key)}" aria-pressed="${isLearned}">${isLearned ? "✓ 覚えた" : "覚えた？"}</button></div>
        </article>`;
    }

    /* ---------- 絞り込み・並び替え ---------- */
    function baseItems() {
      if (state.scope === "all") return ALL.map(rec => ({ rec, books: booksByRec.get(rec.id) || [] }));
      return BOOK.filter(b => state.scope !== "top" || b.s === 3).map(b => ({ rec: b.rec, books: [b] }));
    }

    function applyFilters(items) {
      if (state.chapter) items = items.filter(it => it.books.some(b => b.c === state.chapter));
      if (state.unlearned) items = items.filter(it => !learned.has(keyOf(it)));
      return items;
    }

    function sortItems(list, hasQuery) {
      const mode = state.sort === "auto" ? (hasQuery ? "rel" : "no") : state.sort;
      const rateOf = it => currentRate(it.rec).value ?? -1;
      const cmp = {
        rel: (a, b) => a.rank - b.rank || maxStars(b.books) - maxStars(a.books) || a.rec.term.length - b.rec.term.length || a.rec.id - b.rec.id,
        no: (a, b) => minOrder(a.books) - minOrder(b.books) || a.rec.id - b.rec.id,
        star: (a, b) => maxStars(b.books) - maxStars(a.books) || rateOf(b) - rateOf(a) || minOrder(a.books) - minOrder(b.books),
        rate: (a, b) => rateOf(b) - rateOf(a) || maxStars(b.books) - maxStars(a.books) || a.rec.id - b.rec.id,
      }[mode];
      return list.sort(cmp);
    }

    function scopeLabel() {
      const parts = [{ all: "", book: "厳選300", top: "★★★" }[state.scope], state.chapter, state.unlearned ? "未習得" : ""].filter(Boolean);
      return parts.length ? `［${parts.join("・")}］` : "";
    }

    /* ---------- 今日の10語 ---------- */
    function seededShuffle(list, seedText) {
      let h = 2166136261;
      for (const ch of seedText) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i -= 1) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
      return arr;
    }
    function todayItems() {
      const d = new Date();
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      let pool = BOOK.filter(b => !learned.has(b.key));
      if (!pool.length) pool = BOOK.slice();
      const seen = new Set();
      const picked = seededShuffle(pool, date).filter(b => !seen.has(b.key) && seen.add(b.key)).slice(0, 10);
      return { date, items: picked.sort((a, b) => a.order - b.order).map(b => ({ rec: b.rec, books: [b] })) };
    }

    /* ---------- ダッシュボード ---------- */
    function renderDashboard() {
      const keys = uniqueBookKeys(BOOK);
      const done = keys.filter(k => learned.has(k)).length;
      const pct = keys.length ? Math.round(done / keys.length * 100) : 0;
      const starCount = n => BOOK.filter(b => b.s === n).length;
      const chapterCards = CHAPTERS.map(c => {
        const list = BOOK.filter(b => b.c === c);
        const ks = uniqueBookKeys(list);
        const d = ks.filter(k => learned.has(k)).length;
        return `<button type="button" data-chapter="${c}"><b>${c}</b><small>${ks.length}語 ・ ★★★ ${uniqueBookKeys(list.filter(b => b.s === 3)).length}語</small><small>覚えた ${d}/${ks.length}</small><div class="track"><div class="fill" style="width:${ks.length ? d / ks.length * 100 : 0}%"></div></div></button>`;
      }).join("");
      return `
        <div class="card dash">
          <h2>厳選キーワード300で復習</h2>
          <p class="sub">用語を検索するか、下から復習方法を選んでください。「覚えた」の記録はこのブラウザに保存されます。</p>
          <div class="progress"><div class="track"><div class="fill" style="width:${pct}%"></div></div><strong>覚えた ${done} / ${keys.length}語（${pct}%）</strong></div>
          <div class="quick">
            <button type="button" data-action="today"><b>今日の10語</b><span>勉強のはじめの10分に。未習得から毎日10語を出題</span></button>
            <button type="button" data-action="top"><b>★★★だけ総チェック</b><span>試験直前に最優先で見る高頻出 ${starCount(3)}語</span></button>
            <button type="button" data-action="quiz"><b>4択クイズ</b><span>解説を読んで用語を当てる。今の絞り込みから出題</span></button>
            <button type="button" data-action="all-book"><b>300語を通しで</b><span>付録の順に暗記モードで総復習</span></button>
          </div>
          <div class="star-split"><span class="chip">★★★ ${starCount(3)}語</span><span class="chip">★★ ${starCount(2)}語</span><span class="chip">★ ${starCount(1)}語</span><span class="chip">おまけ ${starCount(0)}語</span></div>
          <p class="section-label">章ごとに見る</p>
          <div class="chapters">${chapterCards}</div>
        </div>`;
    }

    /* ---------- クイズ ---------- */
    const quiz = { current: null, options: [], answered: false, correct: 0, total: 0 };
    function quizPool() {
      let pool = BOOK.filter(b => state.scope !== "top" || b.s === 3);
      if (state.chapter) pool = pool.filter(b => b.c === state.chapter);
      if (state.unlearned) pool = pool.filter(b => !learned.has(b.key));
      return pool;
    }
    function maskText(b) {
      const words = [...new Set([b.k, ...b.al, ...b.recs.flatMap(r => aliasesOf(r.term))])].filter(w => w.length >= 2).sort((x, y) => y.length - x.length);
      let html = escapeHTML(b.d);
      words.forEach(w => {
        const safe = escapeHTML(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        html = html.replace(new RegExp(safe, "gi"), `<span class="blank">　　</span>`);
      });
      return html;
    }
    function newQuestion() {
      const pool = quizPool();
      if (!pool.length) { quiz.current = null; return; }
      const fresh = quiz.current ? pool.filter(x => x.key !== quiz.current.key) : pool;
      const from = fresh.length ? fresh : pool;
      const pick = from[Math.floor(Math.random() * from.length)];
      const same = BOOK.filter(b => b.key !== pick.key && b.c === pick.c);
      const others = BOOK.filter(b => b.key !== pick.key && b.c !== pick.c);
      const used = new Set([pick.key]);
      const wrong = [];
      for (const b of [...seededShuffle(same, String(Math.random())), ...seededShuffle(others, String(Math.random()))]) {
        if (wrong.length >= 3) break;
        if (!used.has(b.key)) { used.add(b.key); wrong.push(b); }
      }
      quiz.current = pick;
      quiz.options = seededShuffle([pick, ...wrong], String(Math.random()));
      quiz.answered = false;
    }
    function renderQuiz() {
      const b = quiz.current;
      if (!b) return `<div class="card empty-state"><strong>出題できる用語がありません</strong>絞り込み（章・★★★・未習得のみ）をゆるめてください。</div>`;
      const opts = quiz.options.map((o, i) => {
        let cls = "";
        if (quiz.answered) { if (o.key === b.key) cls = "correct"; else if (i === quiz.chosen) cls = "wrong"; }
        return `<button type="button" data-opt="${i}" class="${cls}" ${quiz.answered ? "disabled" : ""}>${escapeHTML(o.k)}</button>`;
      }).join("");
      const isLearned = learned.has(b.key);
      const result = quiz.answered ? `
        <div class="q-result">
          <div class="verdict" style="color:var(--${quiz.options[quiz.chosen].key === b.key ? "high" : "low"})">${quiz.options[quiz.chosen].key === b.key ? "正解！" : "不正解…"}　正解は「${escapeHTML(b.k)}」</div>
          ${b.rec.description ? `<div class="note list"><span class="note-label">用語リストの説明</span><p>${escapeHTML(b.rec.description)}</p></div>` : ""}
          <div class="q-actions">
            <button type="button" class="learn-btn" data-learn="${escapeHTML(b.key)}" aria-pressed="${isLearned}">${isLearned ? "✓ 覚えた" : "覚えた？"}</button>
            <button type="button" class="tool-btn" data-action="lookup">この用語を詳しく見る</button>
            <button type="button" class="primary-btn" data-action="next">次の問題 →</button>
          </div>
        </div>` : "";
      return `
        <div class="card quiz">
          <div class="q-meta"><span>${escapeHTML(b.c)} ・ ${b.s ? "頻出 " + starText(b.s) : "おまけ"} ・ 書籍 p.${escapeHTML(b.p || "—")}</span><span>正解 ${quiz.correct} / ${quiz.total}問 ・ 出題範囲 ${quizPool().length}語</span></div>
          <div class="note-label">この説明にあてはまる用語は？</div>
          <div class="q-text">${maskText(b)}</div>
          <div class="options">${opts}</div>
          ${result}
          <div class="q-actions"><button type="button" class="tool-btn" data-action="exit-quiz">クイズを終了</button></div>
        </div>`;
    }

    /* ---------- 描画 ---------- */
    function render() {
      document.querySelectorAll("#scope button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scope === state.scope)));
      document.getElementById("quiz-btn").classList.toggle("on", state.mode === "quiz");
      document.getElementById("today-btn").classList.toggle("on", state.mode === "today");
      chapterEl.value = state.chapter; sortEl.value = state.sort; hideEl.checked = state.hide; unlearnedEl.checked = state.unlearned;

      if (state.mode === "quiz") {
        statusEl.textContent = `4択クイズ ${scopeLabel()}`;
        resultsEl.innerHTML = renderQuiz();
        return;
      }
      if (state.mode === "today") {
        const t = todayItems();
        statusEl.textContent = `今日の10語（${t.date}）— 答えを思い出してからタップ`;
        resultsEl.innerHTML = t.items.map(it => renderCard(it, "")).join("") || `<div class="card empty-state"><strong>出題できる用語がありません</strong></div>`;
        return;
      }

      const raw = queryInput.value;
      const q = normalize(raw);
      if (!q && state.scope === "all" && !state.chapter && !state.unlearned) {
        statusEl.textContent = "用語を入力してください";
        resultsEl.innerHTML = renderDashboard();
        return;
      }
      let items = applyFilters(baseItems());
      if (q) items = items.map(it => ({ ...it, rank: rankItem(it, q) })).filter(it => it.rank < 99);
      items = sortItems(items, !!q);
      const shown = items.slice(0, state.page * PAGE_SIZE);
      statusEl.textContent = items.length
        ? `${scopeLabel()}${items.length.toLocaleString("ja-JP")}件${q ? "見つかりました" : ""}${items.length > shown.length ? `（${shown.length}件を表示中）` : ""}`
        : `${scopeLabel()}該当する用語はありません`;
      resultsEl.innerHTML = shown.length
        ? shown.map(it => renderCard(it, raw)).join("") + (items.length > shown.length ? `<button type="button" class="tool-btn more" data-action="more">さらに表示（残り${items.length - shown.length}件）</button>` : "")
        : `<div class="card empty-state"><strong>${q ? `「${escapeHTML(raw)}」は見つかりませんでした` : "該当する用語はありません"}</strong>${q ? "表記を短くするか、ひらがな・カタカナ・英字でもお試しください。" : ""}${state.scope !== "all" || state.chapter || state.unlearned ? "<br>絞り込みを「すべての用語」「全章」に戻すと見つかる場合があります。" : ""}</div>`;
    }

    function search() { if (state.mode !== "search") state.mode = "search"; state.page = 1; render(); }
    function setScope(scope) { state.scope = scope; state.page = 1; if (state.mode === "quiz") { newQuestion(); } else state.mode = "search"; render(); }
    function startQuiz() { state.mode = "quiz"; quiz.correct = 0; quiz.total = 0; quiz.current = null; newQuestion(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

    /* ---------- イベント ---------- */
    document.getElementById("search-button").addEventListener("click", search);
    document.getElementById("clear").addEventListener("click", () => { queryInput.value = ""; search(); queryInput.focus(); });
    queryInput.addEventListener("keydown", event => { if (event.key === "Enter") search(); });
    let debounce;
    queryInput.addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(search, 130); });
    document.querySelectorAll(".example").forEach(button => button.addEventListener("click", () => { queryInput.value = button.textContent; search(); queryInput.focus(); }));
    document.querySelectorAll("#scope button").forEach(b => b.addEventListener("click", () => setScope(b.dataset.scope)));
    chapterEl.addEventListener("change", () => { state.chapter = chapterEl.value; if (state.chapter && state.scope === "all") state.scope = "book"; state.page = 1; if (state.mode === "quiz") newQuestion(); else state.mode = "search"; render(); });
    sortEl.addEventListener("change", () => { state.sort = sortEl.value; if (state.mode !== "search") state.mode = "search"; render(); });
    hideEl.addEventListener("change", () => { state.hide = hideEl.checked; render(); });
    unlearnedEl.addEventListener("change", () => { state.unlearned = unlearnedEl.checked; state.page = 1; if (state.mode === "quiz") newQuestion(); render(); });
    document.getElementById("quiz-btn").addEventListener("click", () => { if (state.mode === "quiz") { state.mode = "search"; render(); } else startQuiz(); });
    document.getElementById("today-btn").addEventListener("click", () => { if (state.mode === "today") { state.mode = "search"; } else { state.mode = "today"; state.hide = true; queryInput.value = ""; } render(); });
    document.addEventListener("keydown", event => {
      if (event.key === "/" && document.activeElement !== queryInput && !/input|select|textarea/i.test(document.activeElement.tagName)) { event.preventDefault(); queryInput.focus(); }
    });

    resultsEl.addEventListener("click", event => {
      const learnBtn = event.target.closest("[data-learn]");
      if (learnBtn) {
        const key = learnBtn.dataset.learn;
        if (learned.has(key)) learned.delete(key); else learned.add(key);
        saveLearned();
        document.querySelectorAll(`[data-learn="${CSS.escape(key)}"]`).forEach(btn => {
          const on = learned.has(key);
          btn.setAttribute("aria-pressed", String(on)); btn.textContent = on ? "✓ 覚えた" : "覚えた？";
          btn.closest(".card")?.classList.toggle("learned", on);
        });
        return;
      }
      const reveal = event.target.closest("[data-reveal]");
      if (reveal) { reveal.closest(".card").classList.toggle("revealed"); return; }
      const chapterBtn = event.target.closest("[data-chapter]");
      if (chapterBtn) { state.chapter = chapterBtn.dataset.chapter; state.scope = "book"; state.mode = "search"; state.page = 1; render(); return; }
      const opt = event.target.closest("[data-opt]");
      if (opt && !quiz.answered) {
        quiz.chosen = Number(opt.dataset.opt); quiz.answered = true; quiz.total += 1;
        if (quiz.options[quiz.chosen].key === quiz.current.key) quiz.correct += 1;
        render(); return;
      }
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      if (action === "more") { state.page += 1; render(); }
      else if (action === "today") { state.mode = "today"; state.hide = true; render(); }
      else if (action === "top") { state.scope = "top"; state.hide = true; state.mode = "search"; state.page = 1; render(); }
      else if (action === "all-book") { state.scope = "book"; state.hide = true; state.mode = "search"; state.page = 1; render(); }
      else if (action === "quiz") startQuiz();
      else if (action === "next") { newQuestion(); render(); }
      else if (action === "exit-quiz") { state.mode = "search"; render(); }
      else if (action === "lookup") { const k = quiz.current.k; state.mode = "search"; state.scope = "all"; state.chapter = ""; state.unlearned = false; state.hide = false; queryInput.value = k.replace(/[（(].*?[)）]/g, "").split("／")[0]; search(); }
    });

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q");
    if (initialQuery) queryInput.value = initialQuery;
    if (["all", "book", "top"].includes(params.get("scope"))) state.scope = params.get("scope");
    if (CHAPTERS.includes(params.get("chapter"))) state.chapter = params.get("chapter");
    render();
  </script>
</body>
</html>
